packages:
  - apps/*
  - packages/*

# Electron Forge currently includes @electron/node-gyp as a Git subdependency.
# Keep lifecycle scripts allowlisted below; this only permits that dependency shape.
blockExoticSubdeps: false
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.3.4"
  - "@next/eslint-plugin-next@16.3.4"
  - "@next/swc-darwin-arm64@16.3.4"
  - "@next/swc-darwin-x64@16.3.4"
  - "@next/swc-linux-arm64-gnu@16.3.4"
  - "@next/swc-linux-arm64-musl@16.3.4"
  - "@next/swc-linux-x64-gnu@16.3.4"
  - "@next/swc-linux-x64-musl@16.3.4"
  - "@next/swc-win32-arm64-msvc@16.3.4"
  - "@next/swc-win32-x64-msvc@16.3.4"
  - eslint-config-next@16.3.4
  - next@16.3.4
  - electron@44.1.1

onlyBuiltDependencies:
  - electron
  - esbuild
